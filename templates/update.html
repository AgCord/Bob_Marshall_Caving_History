<html>

<head>

    <title> Bob Marshall Caving History - Change Person </title>

</head>

    <body>

        <h1> Change Person </h1>

        <form action="/updateperson" method="GET">

            <input type="hidden" name="id" value="{{ id }}">

            First name: <input type="text" name="first_name" value="{{ first_name }}"><br />
            Last name: <input type="text" name="last_name" value="{{ last_name }}"><br />
            Role: <input type="text" name="role" value="{{ role }}"><br />
            Years active: <input type="text" name="years_active" value="{{ years_active }}"><br />

            <input type="submit" value="Save">

        </form>

    <a href="/person">Return to list</a>    

    </body>

</html>
